<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F3EADC"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB340"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#B45309" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <!-- 左页：整体拉高 -->
    <path d="M 512 376
             C 428 316, 300 286, 212 296
             L 212 664
             C 300 654, 428 684, 512 732
             Z" fill="url(#cover)"/>
    <!-- 右页 -->
    <path d="M 512 376
             C 596 316, 724 286, 812 296
             L 812 664
             C 724 654, 596 684, 512 732
             Z" fill="url(#cover)"/>
  </g>

  <!-- 中缝：底色透出，形成书的开合感 -->
  <path d="M 512 376 L 512 732" stroke="url(#bg)" stroke-width="22" stroke-linecap="round"/>

  <!-- 页面留白高光，呼应纸感 -->
  <path d="M 512 394 C 440 344, 330 320, 246 326" stroke="#FFE0B3" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 512 394 C 584 344, 694 320, 778 326" stroke="#FFE0B3" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- 文字线（白色，随页面弧度倾斜） -->
  <g stroke="#FFF8EF" stroke-width="22" stroke-linecap="round">
    <line x1="280" y1="432" x2="442" y2="466"/>
    <line x1="280" y1="496" x2="442" y2="530"/>
    <line x1="280" y1="560" x2="396" y2="583"/>
    <line x1="582" y1="466" x2="744" y2="432"/>
    <line x1="582" y1="530" x2="744" y2="496"/>
  </g>

  <!-- 拾起的词：从右页提起一道亮线 + 圆点 -->
  <g stroke="#2563EB" stroke-width="28" stroke-linecap="round" fill="none">
    <path d="M 664 360 C 706 332, 748 308, 786 286"/>
  </g>
  <circle cx="806" cy="274" r="30" fill="#2563EB"/>
</svg>
